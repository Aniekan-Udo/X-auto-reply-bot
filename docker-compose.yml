volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:

services:

  # ─── Database: Postgres ──────────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DB_PASSWORD
      POSTGRES_DB: twitter_auto_reply
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Broker: RabbitMQ ────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Result Backend: Redis ───────────────────────────────────────────────
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Bot (Ingestion) ─────────────────────────────────────────────────────
  bot:
    build: .
    command: python main.py
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      POSTGRES_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/twitter_auto_reply
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ─── Celery Worker (AI Processing) ───────────────────────────────────────
  celery_worker:
    build: .
    command: celery -A processing_AI.AI_integration worker --loglevel=info
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/twitter_auto_reply
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure